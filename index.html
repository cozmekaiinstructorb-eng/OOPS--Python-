<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Lab: Learn, Code, Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>Python Lab</b><span id="topicName"></span></div>
  <div class="stats">
    <span id="loadState" class="pill warn">Loading Python…</span>
    <span id="levelTxt"></span>
    <div class="xpbar" title="XP"><i id="xpFill"></i></div>
    <span id="xpTxt"></span>
  </div>
</header>
<div class="layout">
  <nav id="nav" aria-label="Lesson stages"></nav>
  <main>
    <section class="view" id="v-learn"></section>
    <section class="view" id="v-explore"></section>
    <section class="view" id="v-practice"><div id="practiceTabs" class="tabs"></div><div id="ws-practice"></div></section>
    <section class="view" id="v-build"><div id="ws-build"></div></section>
    <section class="view" id="v-code"><div id="ws-code"></div></section>
    <section class="view" id="v-progress"></section>

    <section id="workspace">
      <div id="taskInfo"></div>
      <div class="bar">
        <button id="runBtn" class="primary">Run</button>
        <button id="checkBtn" class="accent">Check answer</button>
        <button id="resetBtn">Reset code</button>
        <button id="clearBtn">Clear output</button>
      </div>
      <textarea id="editor"></textarea>
      <details class="stdin"><summary>Input for <code>input()</code> (one line per call)</summary><textarea id="stdin" rows="3" placeholder="Type each answer on its own line"></textarea></details>
      <pre id="output" aria-live="polite">Output appears here.</pre>
      <div id="results"></div>
    </section>
  </main>
</div>
<footer>Progress is saved in this browser only. It does not sync across devices.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="data/lessons.js"></script>
<script src="js/progress.js"></script>
<script src="js/python-runner.js"></script>
<script src="js/app.js"></script>
</body>
</html>
