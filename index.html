<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Lab — Learn, Code, Build</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>🐍 Python Lab <span>Learn, Code, Build</span></h1>
  <div id="stats"></div>
</header>
<div id="loading">⏳ Loading Python… the first load takes a few seconds.</div>
<nav id="nav"></nav>
<main>
  <section id="stage"></section>
  <section id="workspace" class="card">
    <h2 id="ws-title">Free editor</h2>
    <div id="editor"></div>
    <label for="stdin">Input — one line for each <code>input()</code> call</label>
    <textarea id="stdin" rows="2" placeholder="Asha"></textarea>
    <div class="row">
      <button id="run" class="primary">▶ Run</button>
      <button id="check" class="ok" hidden>✔ Check my solution</button>
      <button id="reset">Reset code</button>
      <button id="clear">Clear output</button>
    </div>
    <pre id="output" aria-live="polite">Output appears here.</pre>
    <div id="results"></div>
  </section>
</main>
<footer>💾 Progress is saved in this browser only (localStorage). It does not sync across devices.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="data/lessons.js"></script>
<script src="js/progress.js"></script>
<script src="js/python-runner.js"></script>
<script src="js/challenge-engine.js"></script>
<script src="js/lesson-engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
